<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>git-batch · 原型 B · 仓库矩阵</title>
<style>
  :root{
    --bg:#151a21; --panel:#1b222b; --panel-2:#202833; --panel-3:#252e3a;
    --border:#2b3542; --border-soft:#232c37; --hover:#222b36; --selected:#1f3b3a;
    --text:#d5dee9; --text-sub:#93a1b1; --text-dim:#6c7a8b;
    --accent:#3fb9a5; --accent-2:#5ed3c0; --accent-soft:rgba(63,185,165,.12);
    --green:#4fbf83; --blue:#5a9cf8; --red:#e06c6c; --amber:#e3b341; --violet:#b48ce0;
    --ui:-apple-system,"SF Pro Text","Segoe UI","PingFang SC","Hiragino Sans GB",sans-serif;
    --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--text);font:13px/1.45 var(--ui);-webkit-font-smoothing:antialiased;overflow:hidden}
  button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
  input{font:inherit}
  .ico{vertical-align:-2px;flex:none}
  .app{display:grid;grid-template-columns:56px minmax(0,1fr);grid-template-rows:46px minmax(0,1fr);height:100vh;min-width:1120px}

  /* 顶栏 */
  .topbar{grid-column:1/3;display:flex;align-items:center;gap:14px;padding:0 16px;background:#12171d;border-bottom:1px solid var(--border)}
  .brand{display:flex;align-items:center;gap:9px;font-weight:600;letter-spacing:.2px;font-size:13px}
  .brand .logo{width:22px;height:22px;border-radius:6px;background:linear-gradient(150deg,#3fb9a5,#1f7f78);display:grid;place-items:center;color:#08110f}
  .crumb{display:flex;align-items:center;gap:7px;color:var(--text-dim);font-size:12px;margin-left:8px}
  .crumb b{color:var(--text-sub);font-weight:500}
  .topbar .spacer{flex:1}
  .gsearch{display:flex;align-items:center;gap:8px;width:280px;height:28px;padding:0 10px;border:1px solid var(--border);border-radius:6px;background:#0f141a;color:var(--text-dim)}
  .gsearch input{width:100%;border:0;outline:0;background:none;color:var(--text);font-size:12px}
  .gsearch input::placeholder{color:#5d6b7c}
  .gsearch kbd{font-family:var(--mono);font-size:10px;border:1px solid #334050;border-radius:3px;padding:0 4px;color:#7d8b9c;background:#18212b}
  .tb-btn{display:flex;align-items:center;gap:6px;height:28px;padding:0 11px;border-radius:6px;border:1px solid var(--border);color:var(--text-sub);font-size:12px;background:#182028}
  .tb-btn:hover{border-color:#3a4756;color:var(--text);background:#1d2630}
  .tb-btn.primary{background:var(--accent);border-color:var(--accent);color:#07120f;font-weight:600}
  .tb-btn.primary:hover{background:var(--accent-2)}
  .avatar{width:26px;height:26px;border-radius:50%;background:#2a3643;border:1px solid #3a4756;display:grid;place-items:center;font-size:11px;color:#a7b6c7;font-weight:600}

  /* 左侧图标栏 */
  .rail{background:#12171d;border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;padding:10px 0;gap:4px}
  .rail button{width:34px;height:34px;border-radius:7px;display:grid;place-items:center;color:var(--text-dim);position:relative}
  .rail button:hover{background:#1c242e;color:var(--text-sub)}
  .rail button.on{background:var(--accent-soft);color:var(--accent)}
  .rail button.on::before{content:"";position:absolute;left:-11px;top:9px;bottom:9px;width:2px;border-radius:2px;background:var(--accent)}
  .rail .spacer{flex:1}

  /* 主内容 */
  .content{display:flex;flex-direction:column;min-height:0;position:relative;overflow:hidden}
  .content-head{padding:16px 22px 12px;border-bottom:1px solid var(--border-soft);display:flex;align-items:flex-end;gap:26px}
  .page-title h1{margin:0;font-size:17px;font-weight:600;letter-spacing:.2px}
  .page-title p{margin:3px 0 0;color:var(--text-dim);font-size:12px}
  .stats{display:flex;gap:26px;margin-left:auto;padding-bottom:2px}
  .stat .k{font-size:11px;color:var(--text-dim)}
  .stat .v{font-family:var(--mono);font-size:19px;font-weight:600;letter-spacing:-.4px;margin-top:1px}
  .stat .v small{font-size:11px;font-family:var(--ui);color:var(--text-dim);font-weight:400;margin-left:3px}
  .stat.warn .v{color:var(--amber)}
  .stat.danger .v{color:var(--red)}
  .stat.ok .v{color:var(--green)}

  .filterbar{display:flex;align-items:center;gap:6px;padding:10px 22px;border-bottom:1px solid var(--border-soft);background:#171e26}
  .seg{display:flex;background:#11171e;border:1px solid var(--border);border-radius:6px;padding:2px}
  .seg button{height:24px;padding:0 11px;border-radius:4px;color:var(--text-dim);font-size:12px}
  .seg button.on{background:#26313d;color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.3)}
  .seg button .n{font-family:var(--mono);font-size:10px;margin-left:4px;color:var(--text-dim)}
  .seg button.on .n{color:var(--accent)}
  .filterbar .spacer{flex:1}
  .mini-search{display:flex;align-items:center;gap:6px;height:28px;padding:0 9px;border:1px solid var(--border);border-radius:6px;background:#11171e;color:var(--text-dim);width:210px}
  .mini-search input{border:0;outline:0;background:none;color:var(--text);width:100%;font-size:12px}
  .mini-search input::placeholder{color:#5d6b7c}
  .icon-btn{width:28px;height:28px;border-radius:6px;border:1px solid var(--border);display:grid;place-items:center;color:var(--text-sub);background:#11171e}
  .icon-btn:hover{border-color:#3a4756;color:var(--text)}
  .icon-btn.on{background:var(--accent-soft);border-color:#2c6b63;color:var(--accent)}

  /* 表格 */
  .table-wrap{flex:1;overflow:auto;min-height:0;padding-bottom:8px}
  .thead,.trow{display:grid;grid-template-columns:44px minmax(180px,1.5fr) 96px minmax(130px,1fr) 68px 86px minmax(220px,1.8fr) 44px;align-items:center;gap:0}
  .thead{position:sticky;top:0;z-index:2;height:34px;background:#182029;border-bottom:1px solid var(--border);color:var(--text-dim);font-size:11px;letter-spacing:.3px;padding-right:14px}
  .thead > span{padding-left:12px}
  .thead .cbcell{padding-left:16px}
  .thead .sortable{cursor:pointer;display:flex;align-items:center;gap:4px}
  .thead .sortable:hover{color:var(--text-sub)}
  .trow{height:44px;border-bottom:1px solid var(--border-soft);padding-right:14px;cursor:pointer;position:relative}
  .trow:hover{background:var(--hover)}
  .trow.active{background:var(--selected)}
  .trow.active::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--accent)}
  .trow > *{padding-left:12px;min-width:0}
  .trow .cbcell{padding-left:16px}
  .cb{appearance:none;width:14px;height:14px;border:1.5px solid #566475;border-radius:3.5px;margin:0;cursor:pointer;position:relative;background:transparent;vertical-align:middle}
  .cb:checked{background:var(--accent);border-color:var(--accent)}
  .cb:checked::after{content:"";position:absolute;left:3.6px;top:1px;width:3.4px;height:7px;border:solid #07120f;border-width:0 1.8px 1.8px 0;transform:rotate(45deg)}
  .repo-cell{display:flex;align-items:center;gap:9px;min-width:0}
  .repo-cell .folder{color:#718097}
  .repo-cell .nm{font-size:13px;color:#e2e9f2;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .repo-cell .pth{font-family:var(--mono);font-size:10.5px;color:#657386;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
  .badge{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 7px;border-radius:4px;font-size:11px;white-space:nowrap}
  .badge.clean{color:#7f8fa3;background:#202a35}
  .badge.dirty{color:#8fc0fa;background:rgba(90,156,248,.13)}
  .badge.conflict{color:#f0a0a0;background:rgba(224,108,108,.13)}
  .badge.paused{color:#98a6b7;background:#242e3a}
  .badge .dot{width:5px;height:5px;border-radius:50%;background:currentColor}
  .branch{display:flex;align-items:center;gap:5px;font-family:var(--mono);font-size:11.5px;color:#a8b7c8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .branch .ico{color:#66788c}
  .num{font-family:var(--mono);font-size:12px}
  .num.muted{color:#5e6d7f}
  .num.blue{color:#7fb0fa}
  .sync{display:flex;gap:8px;font-family:var(--mono);font-size:11.5px;color:#8c9bad}
  .sync .up{color:#7fd4a0}.sync .down{color:#89b6f8}
  .last{display:flex;flex-direction:column;min-width:0}
  .last .msg{font-size:12px;color:#b9c6d4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .last .meta{display:flex;gap:6px;font-size:10.5px;color:#647386;margin-top:1px}
  .last .hash{font-family:var(--mono);color:#7687a0}
  .row-act{display:flex;justify-content:center;color:#6f8093}
  .row-act button{width:24px;height:24px;border-radius:5px;display:grid;place-items:center}
  .row-act button:hover{background:#2c3947;color:var(--text)}

  /* 批量操作条 */
  .bulk{position:absolute;left:50%;bottom:166px;transform:translate(-50%,14px);display:flex;align-items:center;gap:8px;padding:8px 10px 8px 14px;border-radius:9px;background:#1d2732;border:1px solid #33414f;box-shadow:0 16px 40px rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:.18s ease;z-index:5}
  .bulk.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
  .bulk .cnt{font-size:12px;color:var(--text-sub);margin-right:4px}
  .bulk .cnt b{color:var(--accent);font-family:var(--mono)}
  .bulk button{display:flex;align-items:center;gap:5px;height:28px;padding:0 10px;border-radius:5px;color:#c4d1df;font-size:12px;border:1px solid transparent}
  .bulk button:hover{background:#26333f}
  .bulk button.danger{color:#f0a0a0}
  .bulk .sep{width:1px;height:18px;background:#33414f}
  .bulk .clear{color:#8b9aab}

  /* 右侧抽屉 */
  .drawer{position:absolute;top:0;right:0;bottom:0;width:392px;background:var(--panel);border-left:1px solid var(--border);transform:translateX(100%);transition:transform .22s cubic-bezier(.2,.7,.3,1);z-index:6;display:flex;flex-direction:column;box-shadow:-18px 0 40px rgba(0,0,0,.3)}
  .drawer.open{transform:none}
  .drawer-head{display:flex;align-items:center;gap:9px;padding:13px 14px;border-bottom:1px solid var(--border-soft)}
  .drawer-head .nm{font-size:14px;font-weight:600}
  .drawer-head .close{margin-left:auto;width:26px;height:26px;border-radius:5px;display:grid;place-items:center;color:var(--text-dim)}
  .drawer-head .close:hover{background:var(--hover);color:var(--text)}
  .drawer-body{flex:1;overflow:auto;min-height:0}
  .dsec{padding:12px 14px;border-bottom:1px solid var(--border-soft)}
  .dsec h4{margin:0 0 8px;font-size:11px;letter-spacing:.4px;color:var(--text-dim);font-weight:600;text-transform:uppercase}
  .kv{display:flex;justify-content:space-between;gap:12px;font-size:12px;padding:3px 0;color:var(--text-sub)}
  .kv b{font-weight:500;color:#dbe4ee}
  .kv .mono{font-family:var(--mono);font-size:11.5px}
  .dfile{display:flex;align-items:center;gap:8px;height:27px;font-size:12px}
  .fstat{width:13px;font-family:var(--mono);font-size:11px;font-weight:700;text-align:center}
  .fstat.M{color:var(--blue)}.fstat.A{color:var(--green)}.fstat.D{color:var(--red)}.fstat.U{color:var(--amber)}
  .dfile .p{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#c1cdda}
  .dcommit{display:flex;gap:9px;padding:6px 0;font-size:12px}
  .dcommit .rail-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);margin-top:5px;flex:none;position:relative}
  .dcommit .rail-dot::after{content:"";position:absolute;left:3px;top:9px;width:1px;height:26px;background:#2f3c4a}
  .dcommit:last-child .rail-dot::after{display:none}
  .dcommit .cmsg{color:#c9d4e1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dcommit .cmeta{font-size:10.5px;color:var(--text-dim);margin-top:1px}
  .drawer-foot{padding:10px 14px;border-top:1px solid var(--border-soft);display:flex;gap:8px}
  .drawer-foot button{flex:1;height:30px;border-radius:6px;border:1px solid var(--border);color:var(--text-sub);font-size:12px;display:flex;align-items:center;justify-content:center;gap:6px}
  .drawer-foot button:hover{background:var(--hover);color:var(--text)}
  .drawer-foot button.primary{background:var(--accent);border-color:var(--accent);color:#07120f;font-weight:600}
  .drawer-foot button.primary:hover{background:var(--accent-2)}

  /* 底部任务日志 */
  .dock{border-top:1px solid var(--border);background:#141a21;display:flex;flex-direction:column;height:150px;flex:none;transition:height .2s ease}
  .dock.collapsed{height:32px}
  .dock-head{height:32px;display:flex;align-items:center;gap:10px;padding:0 16px;color:var(--text-dim);font-size:11.5px;flex:none}
  .dock-head .tabbtn{padding:2px 8px;border-radius:4px;color:var(--text-dim)}
  .dock-head .tabbtn.on{color:var(--text);background:#212a35}
  .dock-head .spacer{flex:1}
  .dock-head .live{display:flex;align-items:center;gap:5px;color:var(--green);font-size:11px}
  .dock-head .live i{width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 1.6s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .dock-body{flex:1;overflow:auto;padding:2px 16px 10px;font-family:var(--mono);font-size:11.5px;line-height:1.85;min-height:0}
  .logline{display:flex;gap:10px;white-space:pre}
  .logline .t{color:#556476;flex:none}
  .logline .ok{color:#7fd4a0}.logline .warn{color:#e3c06b}.logline .info{color:#89b6f8}.logline .err{color:#ef9a9a}
  .taskbar{display:flex;align-items:center;gap:9px;margin-top:2px}
  .taskbar .track{width:160px;height:3px;background:#273240;border-radius:2px;overflow:hidden}
  .taskbar .fill{height:100%;background:var(--accent);transition:width .4s ease}

  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:#2c3642;border-radius:5px;border:2px solid transparent;background-clip:content-box}
  ::-webkit-scrollbar-thumb:hover{background:#3a4654;background-clip:content-box}
  ::-webkit-scrollbar-track{background:transparent}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><span class="logo" id="brandLogo"></span>git-batch</div>
    <div class="crumb"><span>工作区</span><span>/</span><b>rusthing</b><span>·</span><span>8 个仓库</span></div>
    <span class="spacer"></span>
    <div class="gsearch"><span id="gsearchIcon"></span><input placeholder="搜索仓库、分支或提交" /><kbd>⌘K</kbd></div>
    <button class="tb-btn" id="syncAll"><span data-icon="refresh-cw"></span>同步全部</button>
    <button class="tb-btn primary" id="newBatch"><span data-icon="zap"></span>新建批量任务</button>
    <span class="avatar">林</span>
  </header>

  <nav class="rail">
    <button class="on" title="仓库矩阵" id="railRepos"></button>
    <button title="批量任务" id="railBatch"></button>
    <button title="提交历史" id="railHistory"></button>
    <button title="任务日志" id="railTerm"></button>
    <span class="spacer"></span>
    <button title="设置" id="railSettings"></button>
  </nav>

  <section class="content">
    <div class="content-head">
      <div class="page-title">
        <h1>仓库矩阵</h1>
        <p>批量管理 rusthing 工作区下的所有 Git 仓库</p>
      </div>
      <div class="stats">
        <div class="stat ok"><div class="k">仓库总数</div><div class="v">8</div></div>
        <div class="stat"><div class="k">有未提交变更</div><div class="v">3<small>个</small></div></div>
        <div class="stat warn"><div class="k">待拉取提交</div><div class="v">9<small>个</small></div></div>
        <div class="stat danger"><div class="k">存在冲突</div><div class="v">1<small>个</small></div></div>
      </div>
    </div>

    <div class="filterbar">
      <div class="seg" id="filterSeg">
        <button class="on" data-filter="all">全部<span class="n">8</span></button>
        <button data-filter="dirty">有变更<span class="n">3</span></button>
        <button data-filter="behind">待拉取<span class="n">2</span></button>
        <button data-filter="conflict">冲突<span class="n">1</span></button>
        <button data-filter="paused">已暂停<span class="n">1</span></button>
      </div>
      <span class="spacer"></span>
      <div class="mini-search"><span id="miniSearchIcon"></span><input id="tableSearch" placeholder="筛选仓库" /></div>
      <button class="icon-btn" title="筛选条件" id="btnFilter"></button>
      <button class="icon-btn" title="列设置" id="btnColumns"></button>
      <button class="icon-btn on" title="刷新" id="btnRefresh"></button>
    </div>

    <div class="table-wrap" id="tableWrap">
      <div class="thead">
        <span class="cbcell"><input type="checkbox" class="cb" id="checkAll" /></span>
        <span class="sortable">仓库 <span data-icon="chevron-down"></span></span>
        <span>状态</span>
        <span class="sortable">分支 <span data-icon="chevron-down"></span></span>
        <span>变更</span>
        <span>同步</span>
        <span class="sortable">最近提交 <span data-icon="chevron-down"></span></span>
        <span></span>
      </div>
      <div id="tbody"></div>
    </div>

    <div class="bulk" id="bulkBar">
      <span class="cnt">已选 <b id="bulkCount">0</b> 个仓库</span>
      <span class="sep"></span>
      <button data-op="fetch"><span data-icon="refresh-cw"></span>Fetch</button>
      <button data-op="pull"><span data-icon="arrow-down-to-line"></span>Pull</button>
      <button data-op="push"><span data-icon="arrow-up-from-line"></span>Push</button>
      <button data-op="commit"><span data-icon="git-commit"></span>批量提交</button>
      <span class="sep"></span>
      <button class="danger" data-op="stash"><span data-icon="layers"></span>Stash</button>
      <button class="clear" id="bulkClear">清除</button>
    </div>

    <!-- 抽屉 -->
    <aside class="drawer" id="drawer">
      <div class="drawer-head">
        <span class="folder-ico" id="drawerIcon"></span>
        <span class="nm" id="drawerName">adm-rs</span>
        <span class="badge clean" id="drawerBadge"></span>
        <button class="close" id="drawerClose"></button>
      </div>
      <div class="drawer-body">
        <div class="dsec">
          <h4>仓库信息</h4>
          <div class="kv"><span>路径</span><b class="mono" id="drawerPath"></b></div>
          <div class="kv"><span>当前分支</span><b class="mono" id="drawerBranch"></b></div>
          <div class="kv"><span>与上游</span><b id="drawerSync"></b></div>
          <div class="kv"><span>最近同步</span><b id="drawerFetched">2 分钟前</b></div>
        </div>
        <div class="dsec">
          <h4>工作区变更 <span class="count" id="drawerFileCount"></span></h4>
          <div id="drawerFiles"></div>
        </div>
        <div class="dsec">
          <h4>最近提交</h4>
          <div id="drawerCommits"></div>
        </div>
      </div>
      <div class="drawer-foot">
        <button id="drawerOpen"><span data-icon="external-link"></span>打开目录</button>
        <button class="primary" id="drawerSyncBtn"><span data-icon="refresh-cw"></span>同步此仓库</button>
      </div>
    </aside>

    <div class="dock" id="dock">
      <div class="dock-head">
        <button class="tabbtn on" id="dockTabLog">任务日志</button>
        <button class="tabbtn" id="dockTabCmd">命令回显</button>
        <span class="spacer"></span>
        <span class="live" id="liveTag"><i></i>监听中</span>
        <button class="icon-btn" style="width:24px;height:22px;border:0;background:none" id="dockToggle"></button>
      </div>
      <div class="dock-body" id="dockBody"></div>
    </div>
  </section>
</div>

<script src="assets/ui.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var state = { filter: 'all', search: '', selected: ['adm-rs', 'dtw-rs'], active: 'adm-rs', dockOpen: true };
  var LOGS = MOCK.console.slice();

  document.querySelectorAll('[data-icon]').forEach(function (el) {
    el.innerHTML = icon(el.getAttribute('data-icon'), 14);
  });
  $('brandLogo').innerHTML = icon('git-merge', 14);
  $('gsearchIcon').innerHTML = icon('search', 13);
  $('miniSearchIcon').innerHTML = icon('search', 13);
  $('railRepos').innerHTML = icon('layers', 17);
  $('railBatch').innerHTML = icon('list', 17);
  $('railHistory').innerHTML = icon('history', 17);
  $('railTerm').innerHTML = icon('terminal', 17);
  $('railSettings').innerHTML = icon('settings', 17);
  $('btnFilter').innerHTML = icon('filter', 14);
  $('btnColumns').innerHTML = icon('columns', 14);
  $('btnRefresh').innerHTML = icon('refresh-cw', 14);
  $('drawerIcon').innerHTML = icon('folder', 15);
  $('drawerClose').innerHTML = icon('x', 15);
  $('dockToggle').innerHTML = icon('chevron-down', 14);

  function repoState(r) {
    if (r.paused) return { cls: 'paused', text: '已暂停' };
    if (r.state === 'conflict') return { cls: 'conflict', text: '冲突' };
    if (r.changes > 0) return { cls: 'dirty', text: '有变更' };
    return { cls: 'clean', text: '干净' };
  }

  function visibleRepos() {
    return MOCK.repos.filter(function (r) {
      var st = repoState(r);
      if (state.filter === 'dirty' && !(r.changes > 0 && r.state !== 'conflict')) return false;
      if (state.filter === 'behind' && r.behind === 0) return false;
      if (state.filter === 'conflict' && r.state !== 'conflict') return false;
      if (state.filter === 'paused' && !r.paused) return false;
      if (state.search) {
        var kw = state.search.toLowerCase();
        if (r.name.toLowerCase().indexOf(kw) < 0 && r.branch.toLowerCase().indexOf(kw) < 0) return false;
      }
      return true;
    });
  }

  function renderTable() {
    var rows = visibleRepos();
    $('tbody').innerHTML = rows.map(function (r) {
      var st = repoState(r);
      var checked = state.selected.indexOf(r.id) >= 0;
      return '<div class="trow ' + (r.id === state.active ? 'active' : '') + '" data-id="' + r.id + '">' +
        '<div class="cbcell"><input type="checkbox" class="cb" data-check="' + r.id + '" ' + (checked ? 'checked' : '') + '></div>' +
        '<div class="repo-cell"><span class="folder">' + icon('folder', 15) + '</span>' +
          '<div style="min-width:0"><div class="nm">' + r.name + '</div><div class="pth">' + r.path.replace('~/workspace/rusthing/', '~/rusthing/') + '</div></div></div>' +
        '<div><span class="badge ' + st.cls + '"><span class="dot"></span>' + st.text + '</span></div>' +
        '<div class="branch">' + icon('git-branch', 12) + r.branch + '</div>' +
        '<div class="num ' + (r.changes ? 'blue' : 'muted') + '">' + (r.changes || '—') + '</div>' +
        '<div class="sync">' + (r.ahead ? '<span class="up">↑' + r.ahead + '</span>' : '<span class="muted" style="color:#4d5c6d">↑0</span>') +
          (r.behind ? '<span class="down">↓' + r.behind + '</span>' : '<span style="color:#4d5c6d">↓0</span>') + '</div>' +
        '<div class="last"><div class="msg">' + r.last.msg + '</div>' +
          '<div class="meta"><span class="hash">' + r.last.hash + '</span><span>' + r.last.author + '</span><span>·</span><span>' + r.last.time + '</span></div></div>' +
        '<div class="row-act"><button data-more="' + r.id + '" title="更多操作">' + icon('more-horizontal', 15) + '</button></div>' +
      '</div>';
    }).join('');

    $('tbody').querySelectorAll('.trow').forEach(function (row) {
      row.addEventListener('click', function (e) {
        if (e.target.closest('[data-check]') || e.target.closest('[data-more]')) return;
        state.active = row.getAttribute('data-id');
        renderTable();
        updateCheckAll();
        openDrawer(state.active);
      });
    });
    $('tbody').querySelectorAll('[data-check]').forEach(function (cb) {
      cb.addEventListener('change', function () {
        var id = cb.getAttribute('data-check');
        var i = state.selected.indexOf(id);
        if (cb.checked && i < 0) state.selected.push(id);
        if (!cb.checked && i >= 0) state.selected.splice(i, 1);
        renderBulk();
        updateCheckAll();
      });
    });
    $('tbody').querySelectorAll('[data-more]').forEach(function (btn) {
      btn.addEventListener('click', function (e) {
        e.stopPropagation();
        toast('更多操作：Fetch / Pull / Push / 回滚工作区', 'warn');
      });
    });
    // 高亮当前行
    rows.forEach(function (r) {
      if (state.selected.indexOf(r.id) >= 0) {
        var row = $('tbody').querySelector('[data-id="' + r.id + '"]');
        if (row) row.style.background = '#1c2a2c';
      }
    });
    updateCheckAll();
  }

  function updateCheckAll() {
    var rows = visibleRepos();
    var all = rows.length > 0 && rows.every(function (r) { return state.selected.indexOf(r.id) >= 0; });
    $('checkAll').checked = all;
    $('checkAll').indeterminate = !all && rows.some(function (r) { return state.selected.indexOf(r.id) >= 0; });
    var count = visibleRepos().length;
    $('tableWrap').querySelector('.thead').setAttribute('data-count', count);
  }

  function renderBulk() {
    var n = state.selected.length;
    $('bulkCount').textContent = n;
    $('bulkBar').classList.toggle('show', n > 0);
  }

  function renderLogs() {
    var html = LOGS.map(function (l) {
      return '<div class="logline"><span class="t">[' + l.t + ']</span><span class="' + l.lvl + '">' + esc(l.msg) + '</span></div>';
    }).join('');
    if (state.dockOpen && window.__p) {
      html += '<div class="taskbar"><span style="color:#7d8c9d">批量同步进度</span><span class="track"><i class="fill" style="width:' + (window.__p || 0) + '%"></i></span><span style="color:#8ea0b3" id="pct">' + (window.__p || 0) + '%</span></div>';
    }
    $('dockBody').innerHTML = html;
  }

  function addLog(lvl, msg) {
    var d = new Date();
    LOGS.push({ t: ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2) + ':' + ('0' + d.getSeconds()).slice(-2), lvl: lvl, msg: msg });
    renderLogs();
  }

  function openDrawer(id) {
    var r = repoById(id);
    var st = repoState(r);
    $('drawerName').textContent = r.name;
    $('drawerPath').textContent = r.path;
    $('drawerBranch').textContent = r.branch;
    $('drawerSync').textContent = (r.ahead ? r.ahead + ' 个待推送' : '无待推送') + ' · ' + (r.behind ? r.behind + ' 个待拉取' : '已最新');
    $('drawerBadge').className = 'badge ' + st.cls;
    $('drawerBadge').innerHTML = '<span class="dot"></span>' + st.text;
    $('drawerFileCount').textContent = r.changes;
    var files = r.changes ? MOCK.files.slice(0, Math.min(r.changes, 6)) : [];
    $('drawerFiles').innerHTML = files.length ? files.map(function (f) {
      return '<div class="dfile"><span class="fstat ' + f.status + '">' + f.status + '</span><span class="p">' + f.path + '</span></div>';
    }).join('') : '<div style="font-size:12px;color:#6c7a8b;padding:6px 0">工作区干净，无待提交文件</div>';
    $('drawerCommits').innerHTML = MOCK.commits.slice(0, 4).map(function (c) {
      return '<div class="dcommit"><span class="rail-dot"></span><div style="min-width:0"><div class="cmsg">' + c.msg + '</div><div class="cmeta">' + c.hash + ' · ' + c.author + ' · ' + c.time + '</div></div></div>';
    }).join('');
    $('drawer').classList.add('open');
  }

  function closeDrawer() { $('drawer').classList.remove('open'); }

  function runBulk(op) {
    var ids = state.selected.length ? state.selected : [state.active];
    var names = ids.map(function (id) { return repoById(id).name; });
    var label = { fetch: 'Fetch', pull: 'Pull', push: 'Push', commit: '批量提交', stash: 'Stash' }[op];
    addLog('info', '[' + label + '] 开始：' + names.join(', '));
    toast(label + ' 已提交到队列（' + names.length + ' 个仓库）');
    window.__p = 0;
    renderLogs();
    var timer = setInterval(function () {
      window.__p = Math.min(100, window.__p + 12);
      renderLogs();
      if (window.__p >= 100) {
        clearInterval(timer);
        addLog('ok', '[' + label + '] 完成：' + names.length + ' 个仓库，耗时 2.1s');
        window.__p = 0;
        renderLogs();
      }
    }, 160);
  }

  // 初始化
  $('checkAll').addEventListener('change', function () {
    var rows = visibleRepos();
    if ($('checkAll').checked) {
      rows.forEach(function (r) { if (state.selected.indexOf(r.id) < 0) state.selected.push(r.id); });
    } else {
      state.selected = state.selected.filter(function (id) {
        return !rows.some(function (r) { return r.id === id; });
      });
    }
    renderTable();
    renderBulk();
  });
  $('filterSeg').querySelectorAll('button').forEach(function (b) {
    b.addEventListener('click', function () {
      $('filterSeg').querySelectorAll('button').forEach(function (x) { x.classList.remove('on'); });
      b.classList.add('on');
      state.filter = b.getAttribute('data-filter');
      renderTable();
    });
  });
  $('tableSearch').addEventListener('input', function (e) {
    state.search = e.target.value;
    renderTable();
  });
  $('bulkBar').querySelectorAll('[data-op]').forEach(function (b) {
    b.addEventListener('click', function () { runBulk(b.getAttribute('data-op')); });
  });
  $('bulkClear').addEventListener('click', function () {
    state.selected = [];
    renderTable();
    renderBulk();
  });
  $('drawerClose').addEventListener('click', closeDrawer);
  $('drawerSyncBtn').addEventListener('click', function () {
    toast(repoById(state.active).name + ' 已同步');
    addLog('ok', '[' + repoById(state.active).name + '] fetch origin 完成');
  });
  $('drawerOpen').addEventListener('click', function () { toast('已在文件管理器中打开仓库目录', 'warn'); });
  $('syncAll').addEventListener('click', function () {
    toast('已开始同步全部 8 个仓库');
    window.__p = 0;
    renderLogs();
    addLog('info', '同步全部：8 个仓库加入队列');
  });
  $('newBatch').addEventListener('click', function () { toast('批量任务构建器（原型 C 中展示）', 'warn'); });
  $('railBatch').addEventListener('click', function () { toast('批量任务列表：待执行 / 执行中 / 已完成', 'warn'); });
  $('railHistory').addEventListener('click', function () { toast('跨仓库提交历史（聚合视图）', 'warn'); });
  $('railTerm').addEventListener('click', function () { toast('终端：在指定仓库执行原始 git 命令', 'warn'); });
  $('railSettings').addEventListener('click', function () { toast('设置：仓库扫描路径 / 并发数 / 快捷键', 'warn'); });
  $('btnFilter').addEventListener('click', function () { toast('高级筛选：作者 / 时间 / 变更类型', 'warn'); });
  $('btnColumns').addEventListener('click', function () { toast('列设置：显示或隐藏同步、最近提交等列', 'warn'); });
  $('btnRefresh').addEventListener('click', function () { toast('已刷新 8 个仓库状态'); });
  $('dockTabCmd').addEventListener('click', function () {
    $('dockTabCmd').classList.add('on');
    $('dockTabLog').classList.remove('on');
    $('dockBody').innerHTML = '<div class="logline"><span class="t">$</span><span class="info">git fetch --all --prune</span></div>' +
      '<div class="logline"><span class="t"> </span><span class="ok">Fetching origin</span></div>' +
      '<div class="logline"><span class="t"> </span><span class="ok"> * [new branch]      feature/dlq -> origin/feature/dlq</span></div>' +
      '<div class="logline"><span class="t"> </span><span class="warn">warning: 1 repository has unmerged paths</span></div>';
  });
  $('dockTabLog').addEventListener('click', function () {
    $('dockTabLog').classList.add('on');
    $('dockTabCmd').classList.remove('on');
    renderLogs();
  });
  $('dockToggle').addEventListener('click', function () {
    state.dockOpen = !state.dockOpen;
    $('dock').classList.toggle('collapsed', !state.dockOpen);
    $('bulkBar').style.bottom = state.dockOpen ? '166px' : '48px';
    $('dockToggle').innerHTML = icon(state.dockOpen ? 'chevron-down' : 'chevron-up', 14);
    renderLogs();
  });

  renderTable();
  renderBulk();
  renderLogs();
})();
</script>
</body>
</html>
