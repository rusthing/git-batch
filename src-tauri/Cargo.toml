[package]
name = "git-batch"
version = "0.1.0"
description = "跨平台 Git 批量管理工具"
edition = "2021"

[lib]
name = "git_batch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
